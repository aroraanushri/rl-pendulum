name: PPO tests
on:
  push:
    paths:
      - 'ppo/**'
      - 'tests/**'
      - 'requirements-ppo.txt'
      - '.github/workflows/ppo-tests.yml'
  pull_request:
    paths:
      - 'ppo/**'
      - 'tests/**'
      - 'requirements-ppo.txt'
      - '.github/workflows/ppo-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-ppo.txt
      - run: python -m unittest discover -s tests -v
      - name: CartPole integration smoke test
        run: |
          python -m ppo.train --total-timesteps 1024 --rollout-steps 512
          python -m ppo.evaluate --episodes 2
